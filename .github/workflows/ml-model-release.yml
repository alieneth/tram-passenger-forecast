name: Publish verified ML model

on:
  push:
    tags:
      - ml-platform-0.88724

permissions:
  contents: write

concurrency:
  group: ml-platform-0.88724-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download and verify frozen model
        run: >-
          python3 -m ml.prepare_model_release
          --output ml/artifacts/github_release
          --code-commit "$GITHUB_SHA"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --latest=false \
            --title "ML model — platform score 0.88724" \
            --notes-file ml/RELEASE_NOTES.md \
            ml/artifacts/github_release/bundle.joblib \
            ml/artifacts/github_release/release_manifest.json \
            ml/artifacts/github_release/requirements.txt \
            ml/artifacts/github_release/MODEL_CARD.md
